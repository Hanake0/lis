<!DOCTYPE html>
<html lang="en" class="dark">
<head>
	<meta charset="UTF-8">
	<link rel="stylesheet" href="dist/chat.css">
	<style>
		html,body,#app{height:100%;width:100%;margin:0;padding:0;overflow:hidden;}
		:root {
			--vscode-editor-background: #1e1e2e;
			--vscode-editor-foreground: #cdd6f4;
			--vscode-sideBar-background: #181825;
			--vscode-sideBar-foreground: #cdd6f4;
			--vscode-input-background: #313244;
			--vscode-input-foreground: #cdd6f4;
			--vscode-input-border: #45475a;
			--vscode-button-background: #89b4fa;
			--vscode-button-foreground: #1e1e2e;
			--vscode-focusBorder: #89b4fa;
			--vscode-panel-border: #45475a;
			--vscode-list-hoverBackground: #313244;
			--vscode-font-family: 'Segoe UI', sans-serif;
			--vscode-font-size: 13px;
			color-scheme: dark;
		}
	</style>
	<title>Test Webview</title>
</head>
<body>
	<div id="app"></div>
	<script>
		// Simulate VS Code webview API
		window.acquireVsCodeApi = () => ({
			postMessage: (msg) => console.log('[postMessage]', JSON.stringify(msg)),
			getState: () => ({}),
			setState: () => {},
		});
	</script>
	<script src="dist/chat.js"></script>
	<script>
		// Simulate init message after a short delay
		setTimeout(() => {
			window.postMessage({ type: 'init', chatId: 'test-chat-1' }, '*');
			setTimeout(() => {
				window.postMessage({ type: 'state', state: 'connected' }, '*');
			}, 100);
		}, 500);
	</script>
</body>
</html>
