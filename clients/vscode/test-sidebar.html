<!DOCTYPE html>
<html lang="en" class="dark">
<head>
	<meta charset="UTF-8">
	<link rel="stylesheet" href="dist/chat.css">
	<script>window.__LIS_SIDEBAR_MODE = true;</script>
	<style>
		html,body,#app{height:100%;width:100%;margin:0;padding:0;overflow:hidden;}
		:root {
			--vscode-editor-background: #1e1e2e;
			--vscode-editor-foreground: #cdd6f4;
			--vscode-sideBar-background: #181825;
			--vscode-sideBar-foreground: #cdd6f4;
			--vscode-foreground: #cdd6f4;
			--vscode-input-background: #313244;
			--vscode-input-foreground: #cdd6f4;
			--vscode-focusBorder: #89b4fa;
			--vscode-panel-border: #45475a;
			--vscode-list-hoverBackground: #313244;
			--vscode-descriptionForeground: #a6adc8;
			--vscode-button-background: #89b4fa;
			--vscode-button-foreground: #1e1e2e;
			--vscode-errorForeground: #f38ba8;
			color-scheme: dark;
		}
	</style>
	<title>Test Sidebar (REST + SSE)</title>
</head>
<body>
	<div id="app"></div>
	<script>
		// Capture postMessages the sidebar fires (open_session, etc.) so we can
		// inspect them in DevTools while iterating on the layout.
		window.acquireVsCodeApi = () => ({
			postMessage: (msg) => console.log('[sidebar postMessage]', JSON.stringify(msg)),
			getState: () => ({}),
			setState: () => {},
		});
	</script>
	<script src="dist/chat.js"></script>
	<script>
		// Feed the new RPC client real credentials so it hits the live backend
		// over REST + SSE — same shape the extension host posts to the webview.
		// Override these via ?origin=... &token=... in the URL when serving the
		// fixture from a different host or with a different auth token.
		(function bootstrapLisConfig() {
			const params     = new URLSearchParams(location.search);
			const baseOrigin = params.get('origin') ?? 'http://localhost:3010';
			const token      = params.get('token')  ?? '';
			// The LisRpcClient subscribes to window 'message' events at boot
			// (see src/webview/index.ts → LisRpcClient.install). It listens for
			// `lis.init { baseOrigin, token }` to wire up REST + SSE.
			// Defer so install() has run by the time we fire.
			setTimeout(() => {
				window.postMessage({ type: 'lis.init', baseOrigin, token }, '*');
			}, 50);
		})();

		// Simulate the extension host's host_fs handler so the OC components'
		// filesystem calls (DirectoryExplorerDialog / useDirectoryStatusProbe / etc.)
		// resolve to *something* in the browser fixture. The real extension host
		// answers from vscode.workspace.fs — here we just return an empty list
		// and treat probe as true so the sidebar never hangs.
		window.addEventListener('message', (ev) => {
			const msg = ev.data;
			if (!msg || msg.type !== 'host_fs') return;
			const reply = (ok, result, error) =>
				window.postMessage({ type: 'host_fs_response', request_id: msg.request_id, ok, result, error }, '*');
			switch (msg.op) {
				case 'list':             return reply(true, []);
				case 'probe':            return reply(true, true);
				case 'system_info':      return reply(true, { home: '/home/test', platform: 'browser' });
				case 'home':             return reply(true, '/home/test');
				case 'create_directory': return reply(true, { path: msg.path });
				default:                 return reply(false, null, 'fixture: op not implemented');
			}
		});
	</script>
</body>
</html>
