<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src ${cspSource} 'unsafe-inline'; script-src 'nonce-${nonce}';">
	<link rel="stylesheet" href="${cssUri}">
	<title>Lis</title>
</head>
<body>
	<div class="status" id="status">connecting…</div>

	<div class="chat-bar">
		<select id="chat-select" aria-label="Chat"></select>
		<button id="new-chat" title="New chat">+</button>
	</div>

	<div class="messages" id="messages"></div>

	<div class="typing" id="typing" hidden>
		<span></span><span></span><span></span>
	</div>

	<form class="composer" id="composer">
		<textarea
			id="input"
			rows="1"
			placeholder="Message Lis (Enter to send, Shift+Enter for newline)"
			autofocus></textarea>
		<button type="submit" id="send" aria-label="Send">Send</button>
	</form>

	<script nonce="${nonce}" src="${jsUri}"></script>
</body>
</html>
